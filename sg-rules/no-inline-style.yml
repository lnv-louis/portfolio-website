id: no-inline-style
message: Do not use inline style props. Use StyleX.
severity: error
language: Tsx
files:
  - src/components/**
  - src/app/**
rule:
  kind: jsx_attribute
  all:
    - has: { kind: property_identifier, regex: ^style$ }
    - has:
        kind: jsx_expression
        has: { kind: object }
