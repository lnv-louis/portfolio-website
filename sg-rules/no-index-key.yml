id: no-index-key
message: Do not use array index as React key. Use a stable id.
severity: warning
language: Tsx
files:
  - src/**
rule:
  kind: jsx_attribute
  all:
    - has: { kind: property_identifier, regex: ^key$ }
    - has:
        kind: jsx_expression
        has: { kind: identifier, regex: ^(i|idx|index)$ }
